name: Build iOS IPA (No Mac Required)

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build ARFaceTracker iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode 16
        run: |
          # Use latest Xcode 16 available on macos-14 runner
          if [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate

      - name: Build App (Unsigned for Sideloading)
        run: |
          xcodebuild clean build \
            -project ios/ARFaceTrackerApp.xcodeproj \
            -scheme ARFaceTrackerApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CONFIGURATION_BUILD_DIR="${PWD}/build/Release-iphoneos"

      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          cp -R "build/Release-iphoneos/ARFaceTracker.app" build/Payload/
          cd build
          zip -r -9 ARFaceTrackerApp.ipa Payload/
          ls -lh ARFaceTrackerApp.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARFaceTrackerApp-iOS
          path: build/ARFaceTrackerApp.ipa
          retention-days: 14
