name: ARFaceTrackerApp
options:
  bundleIdPrefix: com.fpsgaze
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_BITCODE: NO

targets:
  ARFaceTrackerApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ARFaceTrackerApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fpsgaze.ARFaceTrackerApp
        PRODUCT_NAME: "ARFaceTracker"
        INFOPLIST_FILE: ARFaceTrackerApp/Info.plist
        TARGETED_DEVICE_FAMILY: "1" # iPhone
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        AD_HOC_CODE_SIGNING_ALLOWED: YES
